name: europa-ciclo
description: Inclui ASML.AS na aba Europa, lança uma compra pelo formulário do exterior, edita, lê de volta cada passo, apaga tudo e confirma que sumiu.
vars:
  ticker: "ASML.AS"
  itens_filtro: {"tipo": "europa", "ordenacao": 1, "classificacao": "0", "categoria": 0, "setor": 0, "segmento": 0, "country": 0, "gestorID": 0, "classificacao2": 0, "exchange": null, "mandatoID": 0}
steps:
  - name: pesquisar
    action: bastter.ativos.pesquisar
    inputs: {tipo: europa, ativo: "ASML"}
    assert: {list_contains: {path: "", where: {Codigo: "${ticker}"}}}
  - name: ativo_ausente
    guard: true
    action: bastter.ativos.obter_itens
    inputs: "${itens_filtro}"
    assert: {list_excludes: {path: Items, where: {Descricao: "${ticker}"}}}
    proves: a aba não mostra o ativo, então ele não é uma posição visível do usuário
  - name: incluir_ativo
    action: bastter.ativos.salvar
    inputs: {tipo: europa, ativoID: 0, classificacaoID: "", quantidade: 0, descricao: "${ticker}", valor: "", moedaAtivoID: 0, tipoImovelID: 12, destinoID: null, instituicao: null, compraImovel: false, descricaoImovel: null, codIRPF: null, naoPatrimonio: false, descricaoIRPF: null, paisID: 0, origemID: null, valorAux: 0, dataAux: null, cnpj: null, controleSaldo: false, dataDividendos: null, tipoAtualizacaoCDI: 0, percentualCDI: 0, vencimento: null, moradia: null}
    assert: {present: [AtivoID]}
    save: {item: AtivoID}
  - name: ativo_sem_movimentacao
    guard: true
    action: bastter.ativos.get_movement
    inputs: {symbol: "${ticker}", tipo: europa, ativoID: "${item}"}
    assert: {empty: [Itens]}
    proves: o item que o salvar devolveu não tem movimentação, então nenhuma operação do usuário fica em risco
  - name: itens_com_ativo
    postcondition_of: bastter.ativos.salvar
    action: bastter.ativos.obter_itens
    inputs: "${itens_filtro}"
    assert: {list_contains: {path: Items, where: {AtivoID: "${item}", Descricao: "${ticker}"}}}
    proves: o ativo aparece na aba Europa com o código da busca
  - name: lancar_compra
    action: bastter.ativos.save_movement
    inputs: {movimentacaoID: 0, tipo: europa, ativoID: "${item}", quantidade: 1, data: "11/03/2026", totalOperacao: 10, totalOperacaoEstrangeiro: 2, corretagem: 0}
    assert: {equals: {Return: true}}
  - name: compra_gravada
    postcondition_of: bastter.ativos.save_movement
    action: bastter.ativos.get_movement
    inputs: {symbol: "${ticker}", tipo: europa, ativoID: "${item}"}
    assert: {list_contains: {path: Itens, where: {Tipo: Buy, Quantidade: 1.0, OperacaoReal: 10.0, OperacaoEstrangeiro: 2.0}}}
    save: {mov: {path: Itens, where: {Tipo: Buy}, field: MovimentacaoID}}
    proves: a compra tem a quantidade e os dois totais enviados
  - name: editar_compra
    action: bastter.ativos.save_movement
    inputs: {movimentacaoID: "${mov}", tipo: europa, ativoID: "${item}", quantidade: 2, data: "11/03/2026", totalOperacao: 20, totalOperacaoEstrangeiro: 4, corretagem: 0}
    assert: {equals: {Return: true}}
  - name: compra_editada
    postcondition_of: bastter.ativos.save_movement
    action: bastter.ativos.get_movement
    inputs: {symbol: "${ticker}", tipo: europa, ativoID: "${item}"}
    assert: {list_contains: {path: Itens, where: {MovimentacaoID: "${mov}", Quantidade: 2.0, OperacaoReal: 20.0, OperacaoEstrangeiro: 4.0}}}
    proves: a mesma movimentação passou a ter quantidade 2, sem criar outra
  - name: posicao_no_item
    action: bastter.ativos.obter_itens
    inputs: "${itens_filtro}"
    assert: {list_contains: {path: Items, where: {AtivoID: "${item}", Quantidade: 2.0}}}
    proves: a posição do ativo soma 2 unidades
  - name: excluir_compra
    action: bastter.ativos.delete_movement
    inputs: {tipo: europa, movimentacaoID: "${mov}"}
    assert: {equals: {Return: OK}}
  - name: compra_sumiu
    postcondition_of: bastter.ativos.delete_movement
    action: bastter.ativos.get_movement
    inputs: {symbol: "${ticker}", tipo: europa, ativoID: "${item}"}
    assert: {list_excludes: {path: Itens, where: {MovimentacaoID: "${mov}"}}}
  - name: ativo_vazio
    action: bastter.ativos.get_movement
    inputs: {ativoID: '${item}', symbol: '${ticker}', tipo: europa}
    assert: {empty: [Itens]}
    proves: o item não tem mais movimentação, então escondê-lo não deixa uma movimentação de teste dentro
  - name: excluir_ativo
    requires: ativo_vazio
    action: bastter.ativos.excluir_item
    inputs: {tipo: europa, ativoID: "${item}", carteiraID: 0}
  - name: ativo_sumiu
    postcondition_of: bastter.ativos.excluir_item
    action: bastter.ativos.obter_itens
    inputs: "${itens_filtro}"
    assert: {list_excludes: {path: Items, where: {AtivoID: "${item}"}}}
    proves: o ativo saiu da aba Europa
