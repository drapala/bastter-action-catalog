name: config-salvar-opcoes
description: Salva o objeto inteiro de opções da carteira (como a tela Configurações faz) com uma só diferença, ExibirLogo de true para false. Lê de volta e confere que só essa opção mudou, depois salva o objeto antigo inteiro e confirma que todas as opções voltaram. Atenção, o servidor ignora ProventosPizzaTipo e ProventosPizzaItem enviados e grava 0 nos dois. A primeira execução mudou esses campos de 1 para 0 sem volta (ver docs/families/pas-e-config.md). A partir daí eles já valem 0 e o cenário passa.
steps:
  - name: opcoes_antes
    action: bastter.ativos.bs2_init
    assert: {equals: {CarteiraOpcoes.ExibirLogo: true, CarteiraOpcoes.ExibirFinanceiroRank: false}}
    save: {opcoes_antes: CarteiraOpcoes}
  - name: salvar_sem_logo
    action: bastter.ativos.salvar_opcoes
    inputs: {TipoExibicao: "${opcoes_antes.TipoExibicao}", ExibirFinanceiro: "${opcoes_antes.ExibirFinanceiro}", ExibirFinanceiroRank: "${opcoes_antes.ExibirFinanceiroRank}", PatrimonioSomaRE: "${opcoes_antes.PatrimonioSomaRE}", PatrimonioSomaImovel: "${opcoes_antes.PatrimonioSomaImovel}", PatrimonioSomaRV: "${opcoes_antes.PatrimonioSomaRV}", ExibirPainelCotacao: "${opcoes_antes.ExibirPainelCotacao}", NaoExibirGraficoAportesAnual: "${opcoes_antes.NaoExibirGraficoAportesAnual}", NaoExibirGraficoAportesJuros: "${opcoes_antes.NaoExibirGraficoAportesJuros}", ExibirLogo: false, FreioAutomatico: "${opcoes_antes.FreioAutomatico}", ExibirQuantoFaltaPositivo: "${opcoes_antes.ExibirQuantoFaltaPositivo}", ExibirRoubei: "${opcoes_antes.ExibirRoubei}", ExibirRoubeiPopup: "${opcoes_antes.ExibirRoubeiPopup}", ExibirQuarentena: "${opcoes_antes.ExibirQuarentena}", ExibirAlertaDiversificacao: "${opcoes_antes.ExibirAlertaDiversificacao}", ExibirFluxoOqFazer: "${opcoes_antes.ExibirFluxoOqFazer}", AlertaTrimestral: "${opcoes_antes.AlertaTrimestral}", OrdenaPorAporte: "${opcoes_antes.OrdenaPorAporte}", UltimaAba: "${opcoes_antes.UltimaAba}", Modo: "${opcoes_antes.Modo}", TemETF: "${opcoes_antes.TemETF}", TemBDR: "${opcoes_antes.TemBDR}", ExibirFinanceiroData: "${opcoes_antes.ExibirFinanceiroData}", ExibirFinanceiroDataBadge: "${opcoes_antes.ExibirFinanceiroDataBadge}", ExibirFinanceiroRecorde: "${opcoes_antes.ExibirFinanceiroRecorde}", ExibirFinanceiroTempo: "${opcoes_antes.ExibirFinanceiroTempo}", OrdenacaoMov: "${opcoes_antes.OrdenacaoMov}", ModoPASTempo: "${opcoes_antes.ModoPASTempo}", ExibirProventosHoje: "${opcoes_antes.ExibirProventosHoje}", IsentoRendimentoExterior: "${opcoes_antes.IsentoRendimentoExterior}", FreioAutomaticoTempo: "${opcoes_antes.FreioAutomaticoTempo}", FreioAutomaticoMeses: "${opcoes_antes.FreioAutomaticoMeses}", ExibirCleitometro: "${opcoes_antes.ExibirCleitometro}", IRCopiarMarcar: "${opcoes_antes.IRCopiarMarcar}", ConsolidadoEvolucaoTipo: "${opcoes_antes.ConsolidadoEvolucaoTipo}", ConsolidadoEvolucaoPeriodo: "${opcoes_antes.ConsolidadoEvolucaoPeriodo}", RoubeiVezes: "${opcoes_antes.RoubeiVezes}", ConsolidaStocksEuropa: "${opcoes_antes.ConsolidaStocksEuropa}", ConsolidaETFsETPs: "${opcoes_antes.ConsolidaETFsETPs}", NotificarProventosApp: "${opcoes_antes.NotificarProventosApp}", HomeNova: "${opcoes_antes.HomeNova}", HomePadrao: "${opcoes_antes.HomePadrao}", ModoOndeAportar: "${opcoes_antes.ModoOndeAportar}", ModoOndeAportarAlternado: "${opcoes_antes.ModoOndeAportarAlternado}", MenuLateralAberto: "${opcoes_antes.MenuLateralAberto}", FinanceiroAportesConsideraRE: "${opcoes_antes.FinanceiroAportesConsideraRE}", FinanceiroAportesConsideraImovel: "${opcoes_antes.FinanceiroAportesConsideraImovel}", FinanceiroAportesConsideraMoeda: "${opcoes_antes.FinanceiroAportesConsideraMoeda}", NaoExibirAlertaInvestidorQualificado: "${opcoes_antes.NaoExibirAlertaInvestidorQualificado}", VarPatrimonialPeriodos: "${opcoes_antes.VarPatrimonialPeriodos}", UltimosProventos: "${opcoes_antes.UltimosProventos}", PasVermelhoQuarentena: "${opcoes_antes.PasVermelhoQuarentena}", ProventosPizzaTipo: "${opcoes_antes.ProventosPizzaTipo}", ProventosPizzaItem: "${opcoes_antes.ProventosPizzaItem}", InsightsClasses: "${opcoes_antes.InsightsClasses}", MoedaIDPadrao: "${opcoes_antes.MoedaIDPadrao}", SorteioAtivoPopup: "${opcoes_antes.SorteioAtivoPopup}", SorteioAtivoData: "${opcoes_antes.SorteioAtivoData}", SorteioAtivoTipo: "${opcoes_antes.SorteioAtivoTipo}", SorteioAtivoAtivoID: "${opcoes_antes.SorteioAtivoAtivoID}", SorteioAtivoCodigo: "${opcoes_antes.SorteioAtivoCodigo}"}
  - name: logo_desligado
    postcondition_of: bastter.ativos.salvar_opcoes
    action: bastter.ativos.bs2_init
    assert:
      equals: {CarteiraOpcoes.ExibirLogo: false, CarteiraOpcoes.TipoExibicao: "${opcoes_antes.TipoExibicao}", CarteiraOpcoes.ExibirFinanceiro: "${opcoes_antes.ExibirFinanceiro}", CarteiraOpcoes.ExibirFinanceiroRank: "${opcoes_antes.ExibirFinanceiroRank}", CarteiraOpcoes.PatrimonioSomaRE: "${opcoes_antes.PatrimonioSomaRE}", CarteiraOpcoes.PatrimonioSomaImovel: "${opcoes_antes.PatrimonioSomaImovel}", CarteiraOpcoes.PatrimonioSomaRV: "${opcoes_antes.PatrimonioSomaRV}", CarteiraOpcoes.ExibirPainelCotacao: "${opcoes_antes.ExibirPainelCotacao}", CarteiraOpcoes.NaoExibirGraficoAportesAnual: "${opcoes_antes.NaoExibirGraficoAportesAnual}", CarteiraOpcoes.NaoExibirGraficoAportesJuros: "${opcoes_antes.NaoExibirGraficoAportesJuros}", CarteiraOpcoes.FreioAutomatico: "${opcoes_antes.FreioAutomatico}", CarteiraOpcoes.ExibirQuantoFaltaPositivo: "${opcoes_antes.ExibirQuantoFaltaPositivo}", CarteiraOpcoes.ExibirRoubei: "${opcoes_antes.ExibirRoubei}", CarteiraOpcoes.ExibirRoubeiPopup: "${opcoes_antes.ExibirRoubeiPopup}", CarteiraOpcoes.ExibirQuarentena: "${opcoes_antes.ExibirQuarentena}", CarteiraOpcoes.ExibirAlertaDiversificacao: "${opcoes_antes.ExibirAlertaDiversificacao}", CarteiraOpcoes.ExibirFluxoOqFazer: "${opcoes_antes.ExibirFluxoOqFazer}", CarteiraOpcoes.AlertaTrimestral: "${opcoes_antes.AlertaTrimestral}", CarteiraOpcoes.OrdenaPorAporte: "${opcoes_antes.OrdenaPorAporte}", CarteiraOpcoes.UltimaAba: "${opcoes_antes.UltimaAba}", CarteiraOpcoes.Modo: "${opcoes_antes.Modo}", CarteiraOpcoes.TemETF: "${opcoes_antes.TemETF}", CarteiraOpcoes.TemBDR: "${opcoes_antes.TemBDR}", CarteiraOpcoes.ExibirFinanceiroData: "${opcoes_antes.ExibirFinanceiroData}", CarteiraOpcoes.ExibirFinanceiroDataBadge: "${opcoes_antes.ExibirFinanceiroDataBadge}", CarteiraOpcoes.ExibirFinanceiroRecorde: "${opcoes_antes.ExibirFinanceiroRecorde}", CarteiraOpcoes.ExibirFinanceiroTempo: "${opcoes_antes.ExibirFinanceiroTempo}", CarteiraOpcoes.OrdenacaoMov: "${opcoes_antes.OrdenacaoMov}", CarteiraOpcoes.ModoPASTempo: "${opcoes_antes.ModoPASTempo}", CarteiraOpcoes.ExibirProventosHoje: "${opcoes_antes.ExibirProventosHoje}", CarteiraOpcoes.IsentoRendimentoExterior: "${opcoes_antes.IsentoRendimentoExterior}", CarteiraOpcoes.FreioAutomaticoTempo: "${opcoes_antes.FreioAutomaticoTempo}", CarteiraOpcoes.FreioAutomaticoMeses: "${opcoes_antes.FreioAutomaticoMeses}", CarteiraOpcoes.ExibirCleitometro: "${opcoes_antes.ExibirCleitometro}", CarteiraOpcoes.IRCopiarMarcar: "${opcoes_antes.IRCopiarMarcar}", CarteiraOpcoes.ConsolidadoEvolucaoTipo: "${opcoes_antes.ConsolidadoEvolucaoTipo}", CarteiraOpcoes.ConsolidadoEvolucaoPeriodo: "${opcoes_antes.ConsolidadoEvolucaoPeriodo}", CarteiraOpcoes.RoubeiVezes: "${opcoes_antes.RoubeiVezes}", CarteiraOpcoes.ConsolidaStocksEuropa: "${opcoes_antes.ConsolidaStocksEuropa}", CarteiraOpcoes.ConsolidaETFsETPs: "${opcoes_antes.ConsolidaETFsETPs}", CarteiraOpcoes.NotificarProventosApp: "${opcoes_antes.NotificarProventosApp}", CarteiraOpcoes.HomeNova: "${opcoes_antes.HomeNova}", CarteiraOpcoes.HomePadrao: "${opcoes_antes.HomePadrao}", CarteiraOpcoes.ModoOndeAportar: "${opcoes_antes.ModoOndeAportar}", CarteiraOpcoes.ModoOndeAportarAlternado: "${opcoes_antes.ModoOndeAportarAlternado}", CarteiraOpcoes.MenuLateralAberto: "${opcoes_antes.MenuLateralAberto}", CarteiraOpcoes.FinanceiroAportesConsideraRE: "${opcoes_antes.FinanceiroAportesConsideraRE}", CarteiraOpcoes.FinanceiroAportesConsideraImovel: "${opcoes_antes.FinanceiroAportesConsideraImovel}", CarteiraOpcoes.FinanceiroAportesConsideraMoeda: "${opcoes_antes.FinanceiroAportesConsideraMoeda}", CarteiraOpcoes.NaoExibirAlertaInvestidorQualificado: "${opcoes_antes.NaoExibirAlertaInvestidorQualificado}", CarteiraOpcoes.VarPatrimonialPeriodos: "${opcoes_antes.VarPatrimonialPeriodos}", CarteiraOpcoes.UltimosProventos: "${opcoes_antes.UltimosProventos}", CarteiraOpcoes.PasVermelhoQuarentena: "${opcoes_antes.PasVermelhoQuarentena}", CarteiraOpcoes.ProventosPizzaTipo: "${opcoes_antes.ProventosPizzaTipo}", CarteiraOpcoes.ProventosPizzaItem: "${opcoes_antes.ProventosPizzaItem}", CarteiraOpcoes.InsightsClasses: "${opcoes_antes.InsightsClasses}", CarteiraOpcoes.MoedaIDPadrao: "${opcoes_antes.MoedaIDPadrao}", CarteiraOpcoes.SorteioAtivoPopup: "${opcoes_antes.SorteioAtivoPopup}", CarteiraOpcoes.SorteioAtivoData: "${opcoes_antes.SorteioAtivoData}", CarteiraOpcoes.SorteioAtivoTipo: "${opcoes_antes.SorteioAtivoTipo}", CarteiraOpcoes.SorteioAtivoAtivoID: "${opcoes_antes.SorteioAtivoAtivoID}", CarteiraOpcoes.SorteioAtivoCodigo: "${opcoes_antes.SorteioAtivoCodigo}"}
    proves: ExibirLogo passou a false e todas as outras opções ficaram iguais
  - name: restaurar_opcoes
    undoes: salvar_sem_logo
    action: bastter.ativos.salvar_opcoes
    inputs: "${opcoes_antes}"
  - name: opcoes_restauradas
    postcondition_of: bastter.ativos.salvar_opcoes
    action: bastter.ativos.bs2_init
    assert: {equals: {CarteiraOpcoes: "${opcoes_antes}"}}
    proves: o objeto de opções inteiro voltou a ser o de antes
