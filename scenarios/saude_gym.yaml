name: saude-gym
description: >
  Bastter Gym, parte privada. Cria um exercício próprio ZZTESTE, edita, marca como favorito,
  monta um programa (série) com ele, edita e renomeia o programa, lê de volta cada passo,
  depois apaga programa, favorito e exercício e confirma que sumiram.
  Não registra treino (GymSaveTreino), porque o treino entra no ranking público do Bastter Gym.
vars:
  favoritos: {pesquisa: "", filtro: 0, categoria: 0, favorito: true}
steps:
  - name: musculos
    action: bastter.saude.gym_list_musculo
    assert: {present: [Items.0.MusculoID]}
    save: {musculo: Items.0.MusculoID}
  - name: criar_exercicio
    action: bastter.saude.gym_save_exercicio
    inputs: {exercicio: {exercicioID: 0, nome: "${prefix} exercicio ${ts}", videoUrl: "", descricao: "", musculos: [{MusculoID: "${musculo}"}]}}
    assert: {equals: {Return: true}}
  - name: exercicio_criado
    postcondition_of: bastter.saude.gym_save_exercicio
    action: bastter.saude.gym_list_exercicio
    assert: {list_contains: {path: Items, where: {Nome: "${prefix} exercicio ${ts}", Favorito: false}}}
    save: {ex: {path: Items, where: {Nome: "${prefix} exercicio ${ts}"}, field: ExercicioID}}
    proves: o exercício aparece na lista do usuário com o nome enviado
  - name: exercicio_detalhe
    action: bastter.saude.gym_get_exercicio
    inputs: {exercicioID: "${ex}"}
    assert: {equals: {Item.ExercicioID: "${ex}", Item.Nome: "${prefix} exercicio ${ts}", Item.Editable: true, Item.Musculos.0.MusculoID: "${musculo}"}}
    proves: o detalhe do exercício traz o músculo enviado e marca o exercício como editável pelo dono
  - name: editar_exercicio
    action: bastter.saude.gym_save_exercicio
    inputs: {exercicio: {exercicioID: "${ex}", nome: "${prefix} exercicio ${ts} v2", videoUrl: "", descricao: "", musculos: [{MusculoID: "${musculo}"}]}}
    assert: {equals: {Return: true}}
  - name: exercicio_editado
    action: bastter.saude.gym_list_exercicio
    assert: {list_contains: {path: Items, where: {ExercicioID: "${ex}", Nome: "${prefix} exercicio ${ts} v2"}}}
    proves: o mesmo ExercicioID passou a ter o nome novo
  - name: favoritar
    action: bastter.saude.gym_save_favorito_exercicio
    inputs: {exercicioID: "${ex}"}
    assert: {equals: {Return: true}}
  - name: favorito_gravado
    postcondition_of: bastter.saude.gym_save_favorito_exercicio
    action: bastter.saude.gym_search_exercicio
    inputs: "${favoritos}"
    assert: {list_contains: {path: "", where: {ExercicioID: "${ex}", Favorito: true}}}
    proves: a busca de favoritos traz o exercício marcado
  - name: criar_programa
    action: bastter.saude.gym_save_serie
    inputs: {serie: {serieID: -1, nome: "${prefix} programa ${ts}", diasSemana: "1,3,", exercicios: [{ExercicioID: "${ex}", Peso: 2, Repeticoes: 3, Series: 1, PesoUnidade: kg, Observacao: "${prefix}"}]}}
    assert: {equals: {Return: true}}
  - name: programa_criado
    postcondition_of: bastter.saude.gym_save_serie
    action: bastter.saude.gym_list_serie
    assert: {list_contains: {path: "", where: {Nome: "${prefix} programa ${ts}", DiasSemana: "1,3,"}}}
    save: {serie: {path: "", where: {Nome: "${prefix} programa ${ts}"}, field: SerieID}}
    proves: o programa aparece na lista com os dias enviados
  - name: programa_detalhe
    action: bastter.saude.gym_get_serie
    inputs: {serieID: "${serie}"}
    assert:
      equals: {SerieID: "${serie}", Nome: "${prefix} programa ${ts}"}
      list_contains: {path: Exercicios, where: {ExercicioID: "${ex}", Peso: 2.0, Repeticoes: 3, Series: 1, PesoUnidade: kg}}
    proves: o programa guarda o exercício com peso, repetições e séries enviados
  - name: editar_programa
    action: bastter.saude.gym_save_serie
    inputs: {serie: {serieID: "${serie}", nome: "${prefix} programa ${ts}", diasSemana: "2,4,", exercicios: [{ExercicioID: "${ex}", Peso: 3, Repeticoes: 2, Series: 2, PesoUnidade: kg, Observacao: "${prefix}"}]}}
    assert: {equals: {Return: true}}
  - name: programa_editado
    action: bastter.saude.gym_get_serie
    inputs: {serieID: "${serie}"}
    assert:
      equals: {SerieID: "${serie}", DiasSemana: "2,4,"}
      list_contains: {path: Exercicios, where: {ExercicioID: "${ex}", Peso: 3.0, Repeticoes: 2, Series: 2}}
    proves: o mesmo SerieID passou a ter os dias e as cargas novas
  - name: renomear_programa
    action: bastter.saude.gym_save_nome_serie
    inputs: {serie: {serieID: "${serie}", nome: "${prefix} programa ${ts} v2"}}
    assert: {equals: {Return: true}}
  - name: programa_renomeado
    postcondition_of: bastter.saude.gym_save_nome_serie
    action: bastter.saude.gym_list_serie
    assert: {list_contains: {path: "", where: {SerieID: "${serie}", Nome: "${prefix} programa ${ts} v2"}}}
    proves: o programa mantém o SerieID e passa a ter o nome novo
  - name: excluir_programa
    action: bastter.saude.gym_delete_serie
    inputs: {serieID: "${serie}"}
    assert: {equals: {Return: true}}
  - name: programa_sumiu
    postcondition_of: bastter.saude.gym_delete_serie
    action: bastter.saude.gym_list_serie
    assert: {list_excludes: {path: "", where: {SerieID: "${serie}"}}}
  - name: desfavoritar
    action: bastter.saude.gym_delete_favorito_exercicio
    inputs: {exercicioID: "${ex}"}
    assert: {equals: {Return: true}}
  - name: favorito_sumiu
    postcondition_of: bastter.saude.gym_delete_favorito_exercicio
    action: bastter.saude.gym_search_exercicio
    inputs: "${favoritos}"
    assert: {list_excludes: {path: "", where: {ExercicioID: "${ex}"}}}
  - name: excluir_exercicio
    action: bastter.saude.gym_delete_exercicio
    inputs: {exercicioID: "${ex}"}
    assert: {equals: {Return: true}}
  - name: exercicio_sumiu
    postcondition_of: bastter.saude.gym_delete_exercicio
    action: bastter.saude.gym_list_exercicio
    assert: {list_excludes: {path: Items, where: {ExercicioID: "${ex}"}}}
