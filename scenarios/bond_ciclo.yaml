name: bond-ciclo
description: Inclui 912828Z37 na aba Bonds, lança uma compra pelo formulário do exterior, lança, edita e apaga um cupom, edita, lê de volta cada passo, apaga tudo e confirma que sumiu.
vars:
  ticker: "912828Z37"
  itens_filtro: {"tipo": "bond", "ordenacao": 1, "classificacao": "0", "categoria": 0, "setor": 0, "segmento": 0, "country": 0, "gestorID": 0, "classificacao2": 0, "exchange": null, "mandatoID": 0}
steps:
  - name: pesquisar
    action: bastter.ativos.pesquisar
    inputs: {tipo: bond, ativo: "2030"}
    assert: {list_contains: {path: "", where: {Codigo: "${ticker}"}}}
  - name: ativo_ausente
    guard: true
    action: bastter.ativos.obter_itens
    inputs: "${itens_filtro}"
    assert: {list_excludes: {path: Items, where: {AtivoRelacionado: "${ticker}"}}}
    proves: a aba não mostra o ativo, então ele não é uma posição visível do usuário
  - name: incluir_ativo
    action: bastter.ativos.salvar
    inputs: {tipo: bond, ativoID: 0, classificacaoID: "", quantidade: 0, descricao: "${ticker}", valor: "", moedaAtivoID: 319, tipoImovelID: 12, destinoID: null, instituicao: null, compraImovel: false, descricaoImovel: null, codIRPF: null, naoPatrimonio: false, descricaoIRPF: null, paisID: 0, origemID: null, valorAux: 0, dataAux: null, cnpj: null, controleSaldo: false, dataDividendos: null, tipoAtualizacaoCDI: 0, percentualCDI: 0, vencimento: null, moradia: null}
    assert: {present: [AtivoID]}
    save: {item: AtivoID}
  - name: ativo_sem_movimentacao
    guard: true
    action: bastter.ativos.get_movement
    inputs: {symbol: "${ticker}", tipo: bond, ativoID: "${item}"}
    assert: {empty: [Itens]}
    proves: o item que o salvar devolveu não tem movimentação, então nenhuma operação do usuário fica em risco
  - name: itens_com_ativo
    postcondition_of: bastter.ativos.salvar
    action: bastter.ativos.obter_itens
    inputs: "${itens_filtro}"
    assert: {list_contains: {path: Items, where: {AtivoID: "${item}", AtivoRelacionado: "${ticker}", MoedaAtivoID: 319}}}
    proves: o bond aparece na aba Bonds com o código CUSIP da busca e a moeda dólar
  - name: lancar_compra
    action: bastter.ativos.save_movement
    inputs: {movimentacaoID: 0, tipo: bond, ativoID: "${item}", quantidade: 1, data: "11/03/2026", totalOperacao: 10, totalOperacaoEstrangeiro: 2, corretagem: 0}
    assert: {equals: {Return: true}}
  - name: compra_gravada
    postcondition_of: bastter.ativos.save_movement
    action: bastter.ativos.get_movement
    inputs: {symbol: "${ticker}", tipo: bond, ativoID: "${item}"}
    assert: {list_contains: {path: Itens, where: {Tipo: Buy, Quantidade: 1.0, OperacaoReal: 10.0, OperacaoEstrangeiro: 2.0}}}
    save: {mov: {path: Itens, where: {Tipo: Buy}, field: MovimentacaoID}}
    proves: a compra tem a quantidade e os dois totais enviados
  - name: editar_compra
    action: bastter.ativos.save_movement
    inputs: {movimentacaoID: "${mov}", tipo: bond, ativoID: "${item}", quantidade: 2, data: "11/03/2026", totalOperacao: 20, totalOperacaoEstrangeiro: 4, corretagem: 0}
    assert: {equals: {Return: true}}
  - name: compra_editada
    postcondition_of: bastter.ativos.save_movement
    action: bastter.ativos.get_movement
    inputs: {symbol: "${ticker}", tipo: bond, ativoID: "${item}"}
    assert: {list_contains: {path: Itens, where: {MovimentacaoID: "${mov}", Quantidade: 2.0, OperacaoReal: 20.0, OperacaoEstrangeiro: 4.0}}}
    proves: a mesma movimentação passou a ter quantidade 2, sem criar outra
  - name: posicao_no_item
    action: bastter.ativos.obter_itens
    inputs: "${itens_filtro}"
    assert: {list_contains: {path: Items, where: {AtivoID: "${item}", Quantidade: 2.0}}}
    proves: a posição do ativo soma 2 unidades
  - name: lancar_cupom
    action: bastter.ativos.bond_cupom_salvar
    inputs: {cupomID: 0, ativoID: "${item}", data: "2026-11-01", valor: 2}
  - name: cupom_gravado
    postcondition_of: bastter.ativos.bond_cupom_salvar
    action: bastter.ativos.bond_cupom_listar
    inputs: {ativoID: "${item}"}
    assert: {list_contains: {path: "", where: {Valor: 2.0}}}
    save: {cupom: {path: "", where: {Valor: 2.0}, field: CupomID}}
    proves: o cupom aparece na lista do bond com o valor enviado
  - name: editar_cupom
    action: bastter.ativos.bond_cupom_salvar
    inputs: {cupomID: "${cupom}", ativoID: "${item}", data: "2026-11-02", valor: 3}
  - name: cupom_editado
    postcondition_of: bastter.ativos.bond_cupom_salvar
    action: bastter.ativos.bond_cupom_listar
    inputs: {ativoID: "${item}"}
    assert: {list_contains: {path: "", where: {CupomID: "${cupom}", Valor: 3.0}}}
    proves: o mesmo cupom passou a ter valor 3, sem criar outro
  - name: excluir_cupom
    action: bastter.ativos.bond_cupom_deletar
    inputs: {cupomID: "${cupom}", ativoID: "${item}"}
  - name: cupom_sumiu
    postcondition_of: bastter.ativos.bond_cupom_deletar
    action: bastter.ativos.bond_cupom_listar
    inputs: {ativoID: "${item}"}
    assert: {list_excludes: {path: "", where: {CupomID: "${cupom}"}}}
  - name: excluir_compra
    action: bastter.ativos.delete_movement
    inputs: {tipo: bond, movimentacaoID: "${mov}"}
    assert: {equals: {Return: OK}}
  - name: compra_sumiu
    postcondition_of: bastter.ativos.delete_movement
    action: bastter.ativos.get_movement
    inputs: {symbol: "${ticker}", tipo: bond, ativoID: "${item}"}
    assert: {list_excludes: {path: Itens, where: {MovimentacaoID: "${mov}"}}}
  - name: excluir_ativo
    action: bastter.ativos.excluir_item
    inputs: {tipo: bond, ativoID: "${item}", carteiraID: 0}
  - name: ativo_sumiu
    postcondition_of: bastter.ativos.excluir_item
    action: bastter.ativos.obter_itens
    inputs: "${itens_filtro}"
    assert: {list_excludes: {path: Items, where: {AtivoID: "${item}"}}}
    proves: o ativo saiu da aba Bonds
